<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sankofa Reader</title><meta name="theme-color" content="#3b1260">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Lora:wght@400;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><style>
:root{--bg:#f6f4ee;--sf:#fff;--tx:#18241c;--mu:#667568;--gr:#3b1260;--or:#f08a24;--ln:#e3e0d6}
*{box-sizing:border-box}
body{margin:0;font:var(--fs,16px)/1.45 var(--ff,'Bricolage Grotesque'),system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:110px}
#app.wide{max-width:980px;padding-bottom:40px}
button,input,select,textarea{font:inherit}
.hd{background:var(--gr);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 64px;border-radius:0 0 28px 28px}
.hd small{opacity:.8;display:block}.hd h1{margin:2px 0 0;font-size:28px;font-weight:800}
.card{background:var(--sf);border-radius:18px;padding:16px;margin:12px 16px;border:1px solid var(--ln)}
.lect{margin-top:-46px;background:linear-gradient(135deg,#fff 30%,#fde3c8)}
.bar{height:8px;background:#e6e2d6;border-radius:9px;margin:10px 0;overflow:hidden}.bar span{display:block;height:100%;background:var(--or)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bt{background:var(--or);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.bt.g2{background:#f3ecf9;color:var(--gr)}.bt.rd{background:#fde8e8;color:#b42318}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;text-align:center;font-size:12.5px}
.g button{background:none;border:0;color:inherit;cursor:pointer}
.g i{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 4px;border-radius:16px;background:#f3ecf9;font-style:normal;font-size:24px}
.tag{background:#f3ecf9;color:var(--gr);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
.ban{position:relative;background:#f3ecf9}.ban p{margin:4px 0 10px;color:var(--mu)}
.x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--mu);cursor:pointer}
.bk{display:flex;gap:14px}.cv{flex:0 0 84px;height:116px;border-radius:8px 14px 14px 8px;color:#fff;font-weight:800;font-size:12px;padding:10px 8px;display:flex;align-items:flex-end;border-left:6px solid rgba(255,255,255,.35)}
.bk small{color:var(--mu);display:block}.ok{display:block;color:var(--gr);font-weight:600;margin-top:6px}
.nv{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--gr);border-radius:22px 22px 0 0;display:flex;justify-content:space-around;align-items:flex-end;padding:10px 6px calc(env(safe-area-inset-bottom,0px) + 10px)}
.nv button{color:#e6d9f2;background:none;border:0;font-size:12.5px;cursor:pointer;padding:6px}.nv .on{color:var(--or);font-weight:600}
.nv .ct{width:64px;height:64px;border-radius:50%;background:var(--or);color:#fff;margin-top:-38px;border:5px solid var(--bg);font-weight:600}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh>div{background:var(--bg);width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 30px}
.ch{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln)}.ch input{width:22px;height:22px;accent-color:var(--gr)}
#t{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#18241c;color:#fff;padding:10px 16px;border-radius:12px;z-index:9;max-width:90%}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:#fff;margin:4px 0 10px}
input[type=checkbox]{width:auto}label{font-size:13px;color:var(--mu)}
.ah{background:var(--gr);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.ah b{font-size:20px}
.tb{display:flex;gap:6px;overflow-x:auto;padding:12px 16px}.tb button{white-space:nowrap;border:1px solid var(--ln);background:#fff;border-radius:20px;padding:8px 14px;cursor:pointer}.tb .on{background:var(--gr);color:#fff;border-color:var(--gr)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 16px}.kp div{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px}.kp b{font-size:22px;display:block}.kp small{color:var(--mu)}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--ln);text-align:left}
.sm{padding:6px 10px;font-size:13px}.lk{background:none;border:0;color:var(--mu);text-decoration:underline;margin:20px auto;display:block;cursor:pointer}
.lg{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:12px;padding:3px;float:right}
.rt{line-height:1.6}.rt h3{margin:.6em 0 .2em}.rt img{max-width:100%}
.ed{min-height:110px;border:1px solid var(--ln);border-radius:0 0 10px 10px;padding:10px;background:#fff;margin-bottom:10px}
.tl{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#f3ecf9;border:1px solid var(--ln);border-radius:10px 10px 0 0}
.tl button,.tl select{width:auto;margin:0;padding:5px 8px;border:1px solid var(--ln);border-radius:6px;background:#fff;font-size:13px;cursor:pointer}
.tl input{width:34px;height:30px;padding:0;margin:0}
</style></head><body>
<div id="app"></div><div id="t" hidden></div>
